name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # domping is private: fetch it from GitHub directly, with DOMPING_TOKEN
  # (a fine-grained token with read access to sbroekhoven/domping only).
  GOPRIVATE: github.com/sbroekhoven/*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Access to private modules
        env:
          DOMPING_TOKEN: ${{ secrets.DOMPING_TOKEN }}
        run: |
          test -n "$DOMPING_TOKEN" || { echo "::error::repository secret DOMPING_TOKEN is not set"; exit 1; }
          git config --global url."https://x-access-token:${DOMPING_TOKEN}@github.com/sbroekhoven/".insteadOf "https://github.com/sbroekhoven/"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: go test -race
        run: go test -race ./...

      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/sbdomwatch

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.DOMPING_TOKEN }}
