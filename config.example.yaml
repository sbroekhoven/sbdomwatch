# Copy to config.yaml. Secrets never go in this file: set them in the
# environment or in .env (see .env.example). A secret here is a startup error.
listen: ":8480"
db_path: /data/sbdomwatch.db
resolvers: ["1.1.1.1:53", "9.9.9.9:53"]
rate_limits:
  dns_per_sec: 20
  rdap_per_sec_per_registry: 1
defaults:
  baseline_observations: 3
  baseline_gap: 3m
  debounce_observations: 2
  intervals:
    owned: 1h
    candidate: 6h
    third-party: 6h
  candidate_ttl: 2160h   # candidates are archived after 90 days without a notable change
  expiry_warning: 720h   # owned domains: warn 30 days before the registration expires
scheduler:
  workers: 8      # watches checked concurrently
  tick: 5s        # how often to look for due watches
sinks:                 # a sink is on when its URL variable is set (in .env)
  discord:
    webhook_env: SBDOMWATCH_DISCORD_WEBHOOK   # name of the variable, not the URL
    min_severity: medium                      # info, medium, high or critical
  webhook:                                    # generic JSON webhook, e.g. sbalert
    url_env: SBDOMWATCH_WEBHOOK_URL
    secret_env: SBDOMWATCH_WEBHOOK_SECRET     # optional HMAC-SHA256 signing key
    min_severity: info
log_level: info
